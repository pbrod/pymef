# Travis configuration file using the build matrix feature
# Read more under http://docs.travis-ci.com/user/build-configuration/
# and https://conda.io/docs/user-guide/tasks/use-conda-with-travis-ci.html
# THIS SCRIPT IS SUPPOSED TO BE AN EXAMPLE. MODIFY IT ACCORDING TO YOUR NEEDS!
dist: xenial
sudo: false
language: python
# We don't actually use the Travis Python, but this keeps it organized.
  - 3.5
  - 3.6
  - 3.7
  - 3.8

services:
    - xvfb

notifications:
  email: false
 
# Setup anaconda
before_install:
  - wget https://repo.continuum.io/miniconda/Miniconda3-latest-Linux-x86_64.sh -O miniconda.sh;
  - bash miniconda.sh -b -p $HOME/miniconda
  - export PATH="$HOME/miniconda/bin:$PATH"
  - hash -r
  - conda config --set always_yes yes --set changeps1 no
  - conda update -q conda
  # Useful for debugging any issues with conda
  - conda info -a
  - conda install conda-build
  - conda create -q -n condaenv python=$TRAVIS_PYTHON_VERSION
  - conda install -n condaenv pip
  - conda config --add channels conda-forge
  - conda config --add channels https://conda.anaconda.org/qttesting
  - source activate condaenv
# Install packages
install:
  - conda install --yes python=$TRAVIS_PYTHON_VERSION numpy scipy pytest
  - pip install coveralls
  - pip install codecov
  - python setup.py install
#  - conda build conda_recipe
#  - conda install numdifftools --use-local
before_script:
  - git config --global user.email "per.andreas.brodtkorb@gmail.com"
  - git config --global user.name "pbrod"
script:
  - pwd
  - ls
  - coverage erase
  - coverage run --source=pymef -m py.test build/lib
# see http://www.camillescott.org/2016/07/15/travis-pytest-scipyconf/
#  - sed -i 's/filename="/filename=".\//g' ./coverage-reports/coverage.xml
#  - pylint numdifftools -r n --msg-template="{path}:{line}: [{msg_id}({symbol}), {obj}] {msg}" > pylint-report.txt
# see https://community.sonarsource.com/t/sonarqube-reports-zero-coverage-from-coverage-xml-generated-by-coverage-py-in-  azure-devops/28817/7

after_success:
  - coveralls
  - codecov
cache:
  - apt
